[workspace]
resolver = "2"

members = [
    "crates/consensus",
    "crates/evm-types",
    "crates/kanari-node",
    "crates/move-execution",
    "crates/server_rpc",
    "crates/storage",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
authors = ["Kanari Network"]
license = "Apache-2.0"
repository = "https://github.com/kanari-network/kanari-sdk"
homepage = "https://kanarinetwork.site"
documentation = "https://docs.kanarinetwork.site"

[workspace.dependencies]
# NOTE: standalone workspace so EVM dependency versions float independently
# of kanari-sdk pins.
#
# Full-node note: reth (paradigmxyz/reth) v2.5.2 cannot build on Windows —
# `reth-provider` unconditionally imports items that
# `reth-static-file-types` gates behind `#[cfg(all(feature = "std", unix))]`,
# and reth ships no Windows binaries. Until upstream fixes Windows support,
# execution builds on the published `revm` interpreter (which is
# Windows-clean and supports custom precompiles — the extension point for
# Kanari PQC verification precompiles). The reth full node (sync, MDBX
# storage, networking) remains a Linux CI/docker target; revisit the
# `reth-node-builder` git dependency then.
revm = "43.0.2"
revm-inspector = "43.0.2"
kanari-crypto = { git = "https://github.com/jamesatomc/kanari-sdk.git", rev = "a620725ce036dd2dbff54ac86ea562806480963b" }
smt = { git = "https://github.com/jamesatomc/kanari-sdk.git", rev = "a620725ce036dd2dbff54ac86ea562806480963b" }
# Mysticeti DAG consensus as the ordering layer (in-process cores for tests;
# networked validators reuse the same Core/Committer types via the syncer).
dag = { git = "https://github.com/jamesatomc/kanari-sdk.git", rev = "a620725ce036dd2dbff54ac86ea562806480963b" }
consensus = { git = "https://github.com/jamesatomc/kanari-sdk.git", rev = "a620725ce036dd2dbff54ac86ea562806480963b" }
tokio = { version = "1.53.1", features = ["full"] }
axum = "0.8.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
alloy-consensus = { version = "2.4.2", features = ["k256"] }
alloy-eips = "2.4.2"
alloy-primitives = "1.7.3"
rocksdb = "0.25.0"
alloy-signer = "2"
alloy-signer-local = "2.4.2"
clap = { version = "4.6.6", features = ["derive"] }
thiserror = "2.0.20"
# Committee key randomness (any recent rand works: keys enter mysticeti as
# raw bytes via Signer::from_bytes, never through its Rng-trait API).
rand = "0.10.2"
reqwest = { version = "0.13.5", features = ["json"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
toml = "1.1.6"

# Internal crates.
kanari-evm-consensus = { path = "crates/consensus" }
kanari-evm-move-execution = { path = "crates/move-execution" }
kanari-evm-rpc = { path = "crates/server_rpc" }
kanari-evm-storage = { path = "crates/storage" }
kanari-evm-types = { path = "crates/evm-types" }
