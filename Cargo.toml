[workspace]
resolver = "2"

[package]
name = "kanari-evm"
edition = "2024"
categories = ["development-tools"]
keywords = ["blockchain", "sdk", "move", "rust", "evm"]
homepage = "https://kanarinetwork.site"
documentation = "https://docs.kanarinetwork.site"
version = "0.0.1"
authors = ["Kanari Network"]
license = "Apache-2.0"
repository = "https://github.com/kanari-network/kanari-sdk"
description = "Kanari EVM execution layer (custom chain spec, PQC-ready precompiles)."

# NOTE: standalone workspace (excluded from the root workspace) so EVM
# dependency versions float independently of kanari-sdk pins.
#
# Full-node note: reth (paradigmxyz/reth) v2.5.2 cannot build on Windows —
# `reth-provider` unconditionally imports items that
# `reth-static-file-types` gates behind `#[cfg(all(feature = "std", unix))]`,
# and reth ships no Windows binaries. Until upstream fixes Windows support,
# this crate builds execution on the published `revm` interpreter (which is
# Windows-clean and supports custom precompiles — the extension point for
# Kanari PQC verification precompiles). The reth full node (sync, MDBX
# storage, networking) remains a Linux CI/docker target; revisit the
# `reth-node-builder` git dependency then.

[dependencies]
revm = "43.0.2"
kanari-crypto = { git = "https://github.com/jamesatomc/kanari-sdk.git" }
kanari-db-common = { git = "https://github.com/jamesatomc/kanari-sdk.git" }
smt = { git = "https://github.com/jamesatomc/kanari-sdk.git" }
# Mysticeti DAG consensus as the EVM ordering layer (in-process cores here;
# networked validators reuse the same Core/Committer types via the syncer).
dag = { git = "https://github.com/jamesatomc/kanari-sdk.git" }
consensus = { git = "https://github.com/jamesatomc/kanari-sdk.git" }
tokio = { version = "1.53.1", features = ["full"] }
axum = "0.8.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
alloy-consensus = { version = "2.4.2", features = ["k256"] }
alloy-eips = "2.4.2"
alloy-primitives = "1.7.3"
rocksdb = "0.25"
alloy-signer = "2"
alloy-signer-local = "2.4.2"
clap = { version = "4.6.6", features = ["derive"] }
thiserror = "2.0.20"

[dev-dependencies]
reqwest = { version = "0.13.5", features = ["json"] }

[features]
default = []
